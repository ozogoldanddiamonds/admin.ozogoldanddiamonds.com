<div class="container">

    <div class="row">

        <div class="col-md-12">

            <div class="title-section">

                <h2>Create Category</h2>

            </div>

        </div>

        <div class="category-card">

            <form
                [formGroup]="categoryForm"
                (ngSubmit)="onSubmit()"
            >

                <div class="form-layout">

                    <!-- Left Section -->

                    <div class="left-section">

                        <!-- Category Name -->

                        <div class="form-group">

                            <label>
                                Category Name
                                <span class="required">*</span>
                            </label>

                            <input
                                type="text"
                                formControlName="name"
                                placeholder="Enter category name"
                            />


                            <!-- Required Validation -->

                            <div
                                class="validation-message"
                                *ngIf="
                                    categoryForm.get('name')?.touched &&
                                    categoryForm.get('name')?.hasError('required')
                                "
                            >
                                Category name is required.
                            </div>


                            <!-- Minimum Length Validation -->

                            <div
                                class="validation-message"
                                *ngIf="
                                    categoryForm.get('name')?.touched &&
                                    categoryForm.get('name')?.hasError('minlength')
                                "
                            >
                                Category name must be at least 3 characters.
                            </div>

                        </div>



                        <!-- Category Image -->

                        <div class="form-group">

                            <label>
                                Category Image
                                <span class="required">*</span>
                            </label>

                            <input
                                type="file"
                                (change)="onFileChange($event)"
                            />


                            <!-- Image Required Validation -->

                            <div
                                class="validation-message"
                                *ngIf="
                                    categoryForm.get('image')?.touched &&
                                    categoryForm.get('image')?.hasError('required')
                                "
                            >
                                Category image is required.
                            </div>

                        </div>

                    </div>



                    <!-- Right Section -->

                    <div class="right-section">

                        <div class="preview-box">

                            <img
                                *ngIf="imagePreview"
                                [src]="imagePreview"
                                alt="Preview"
                            />

                            <p *ngIf="!imagePreview">
                                Image Preview
                            </p>

                        </div>

                    </div>

                </div>



                <!-- Buttons -->

                <div class="button-group">

                    <button
                        type="submit"
                        class="btn-create"
                        [disabled]="isSaving"
                    >

                        <span
                            *ngIf="isSaving"
                            class="spinner-border spinner-border-sm me-2"
                        >
                        </span>

                        {{ isSaving ? 'Saving...' : 'Save' }}

                    </button>


                    <button
                        type="button"
                        class="btn-back"
                        (click)="goBack()"
                    >
                        Back
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
