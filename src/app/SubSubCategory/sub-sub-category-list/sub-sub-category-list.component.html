<div class=" container category-container">

  <!-- Top Row -->
  <div class="top-row">

    <div class="title-section">
      <h2>Sub SubCategory Management</h2>
      <p>Manage all sub subcategories here</p>
    </div>

    <div class="button-section" *ngIf="role==='BRANCH'">
      <button routerLink="/admin/Create-subsubcategory">
        Add SubSubCategory
      </button>
    </div>

  </div>

  <!-- Search -->
  <div class="search-row">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Search SubSubCategory</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Enter subsubcategory name">
    </mat-form-field>
  </div>

  <!-- Table -->
  <div class="table-row">

    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

      <!-- S.No -->
      <ng-container matColumnDef="sno">
        <th mat-header-cell *matHeaderCellDef>S.No</th>
        <td mat-cell *matCellDef="let element; let i = index">
          {{ i + 1 }}
        </td>
      </ng-container>

      <!-- Name -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          Name
        </th>
        <td mat-cell *matCellDef="let element">
          {{ element.name }}
        </td>
      </ng-container>

      <!-- Category -->
      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>
          Category
        </th>
        <td mat-cell *matCellDef="let element">
          {{ element.category?.name }}
        </td>
      </ng-container>

      <!-- SubCategory -->
      <ng-container matColumnDef="subCategory">
        <th mat-header-cell *matHeaderCellDef>
          SubCategory
        </th>
        <td mat-cell *matCellDef="let element">
          {{ element.subCategory?.name }}
        </td>
      </ng-container>

      <!-- Image -->
      <ng-container matColumnDef="image">
        <th mat-header-cell *matHeaderCellDef>
          Image
        </th>
        <td mat-cell *matCellDef="let element">
          <img [src]="element.image" width="60" height="60">
        </td>
      </ng-container>

      <!-- Status -->
      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef>
          Status
        </th>
        <td mat-cell *matCellDef="let element">
          {{ element.isActive ? 'Active' : 'Inactive' }}
        </td>
      </ng-container>


      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let element">
          <div class="action-buttons">
            <!-- View -->
            <button mat-icon-button class="view-btn" (click)="viewSubSubCategory(element)">
              <i class="fa fa-eye" aria-hidden="true"></i> </button>


            <button mat-icon-button class="edit-btn" (click)="editSubSubCategory(element)" *ngIf="role==='BRANCH'">
              <i class="fa fa-pencil"></i>
            </button>

            <button mat-icon-button class="delete-btn" (click)="deleteSubSubCategory(element)" *ngIf="role==='BRANCH'">
              <i class="fa fa-trash" aria-hidden="true"></i> </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20, 50]" showFirstLastButtons>
    </mat-paginator>

  </div>

</div>
