<div class="ads-container">

  <div class="header">

    <div>

      <h2>
        Ads Management
      </h2>

      <p>
        Manage all ads here
      </p>

    </div>

  </div>

  <div class="search-box">

    <mat-form-field appearance="outline" class="full-width">

      <mat-label>
        Search Ads
      </mat-label>

      <input matInput placeholder="Search" (keyup)="applyFilter($event)">

    </mat-form-field>

  </div>

  <div class="table-wrapper">

    <table mat-table [dataSource]="dataSource">

      <!-- Section -->

      <ng-container matColumnDef="section">

        <th mat-header-cell *matHeaderCellDef>

          Section

        </th>

        <td mat-cell *matCellDef="let element">

          {{element.sectionName}}

        </td>

      </ng-container>

      <!-- Title -->

      <ng-container matColumnDef="title">

        <th mat-header-cell *matHeaderCellDef>

          Title

        </th>

        <td mat-cell *matCellDef="let element">

          {{element.title}}

        </td>

      </ng-container>

      <!-- Description -->

      <ng-container matColumnDef="description">

        <th mat-header-cell *matHeaderCellDef>

          Description

        </th>

        <td mat-cell *matCellDef="let element">

          {{element.description}}

        </td>

      </ng-container>

      <!-- Image -->

      <ng-container matColumnDef="image">

        <th mat-header-cell *matHeaderCellDef>

          Image

        </th>

        <td mat-cell *matCellDef="let element">

          <img [src]="element.image" class="ads-image">

        </td>

      </ng-container>
      <ng-container matColumnDef="status">

        <th mat-header-cell *matHeaderCellDef>
          Status
        </th>

        <td mat-cell *matCellDef="let element">

          <span class="status-badge" [ngClass]="element.isActive ? 'active' : 'inactive'"
            (click)="changeStatus(element)">

            {{ element.isActive ? 'Active' : 'Inactive' }}

          </span>

        </td>

      </ng-container>

      <!-- Action -->

      <ng-container matColumnDef="actions">

        <th mat-header-cell *matHeaderCellDef>

          Actions

        </th>

        <td mat-cell *matCellDef="let element">
          <button mat-icon-button class="edit-btn" (click)="editAds(element)">
            <i class="fa fa-pencil" aria-hidden="true"></i>
          </button>


        </td>

      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns">
      </tr>

      <tr mat-row *matRowDef="
          let row;
          columns: displayedColumns">
      </tr>

    </table>

    <mat-paginator [pageSizeOptions]="[5,10,20]" showFirstLastButtons>
    </mat-paginator>

  </div>

</div>
