<div class="update-container">

  <h2 class="page-title">
    Update Ads
  </h2>

  <div class="update-card">

    <form
      [formGroup]="updateForm"
      class="form-section">

      <div class="form-group">

        <label>
          Title
        </label>

        <input
          type="text"
          formControlName="title"
          class="form-control">

      </div>

      <div class="form-group">

        <label>
          Description
        </label>

        <textarea
          rows="5"
          formControlName="description"
          class="form-control">
        </textarea>

      </div>

      <div class="form-group">

        <label>
          Ads Image
        </label>

        <input
          type="file"
          class="form-control"
          (change)="onImageSelect($event)">
      </div>

    </form>

    <div class="preview-section">

      <img
        *ngIf="imagePreview"
        [src]="imagePreview"
        class="preview-image">
<div class="button-group">

  <button
    type="button"
    class="btn-create"
    (click)="updateAds()">

    Update

  </button>

  <button
    type="button"
    class="btn-back"
    (click)="goBack()">

    Back

  </button>

</div>

    </div>

  </div>

</div>
