<div class="product-container">

    <!-- ================================= -->
    <!-- TOP SECTION -->
    <!-- ================================= -->

    <div class="top-section">
        <div>
            <h2>Assigned Products</h2>
            <p>View products assigned to selected sub branch</p>
        </div>
    </div>

    <!-- ================================= -->
    <!-- SEARCH -->
    <!-- ================================= -->

    <div class="search-section">

        <mat-form-field appearance="outline" class="w-100">

            <mat-label>

                Search Product

            </mat-label>

            <input matInput placeholder="Search Product" (keyup)="applyFilter($event)">

        </mat-form-field>

    </div>

    <!-- ================================= -->
    <!-- TABLE -->
    <!-- ================================= -->

    <div class="table-section">

        <table mat-table [dataSource]="dataSource" matSort>

            <!-- S.NO -->

            <ng-container matColumnDef="sno">

                <th mat-header-cell *matHeaderCellDef>

                    S.No

                </th>

                <td mat-cell *matCellDef="let element; let i=index">

                    {{i+1}}

                </td>

            </ng-container>

            <!-- IMAGE -->

            <ng-container matColumnDef="image">

                <th mat-header-cell *matHeaderCellDef>

                    Image

                </th>

                <td mat-cell *matCellDef="let element">

                    <img [src]="element.productId.images[0]" class="product-image">

                </td>

            </ng-container>

            <!-- PRODUCT -->

            <ng-container matColumnDef="name">

                <th mat-header-cell *matHeaderCellDef>

                    Product

                </th>

                <td mat-cell *matCellDef="let element">

                    {{element.productId.name}}

                </td>

            </ng-container>

            <!-- CATEGORY -->

            <ng-container matColumnDef="category">

                <th mat-header-cell *matHeaderCellDef>

                    Category

                </th>

                <td mat-cell *matCellDef="let element">

                    {{element.productId.category?.name}}

                </td>

            </ng-container>

            <!-- SKU -->

            <ng-container matColumnDef="sku">

                <th mat-header-cell *matHeaderCellDef>

                    SKU

                </th>

                <td mat-cell *matCellDef="let element">

                    {{element.variant?.sku}}

                </td>

            </ng-container>

            <!-- PURITY -->

            <ng-container matColumnDef="purity">

                <th mat-header-cell *matHeaderCellDef>

                    Purity

                </th>

                <td mat-cell *matCellDef="let element">

                    {{element.variant?.metalPurity}}

                </td>

            </ng-container>

            <!-- ASSIGNED -->

            <ng-container matColumnDef="assignedQuantity">

                <th mat-header-cell *matHeaderCellDef>

                    Assigned Qty

                </th>

                <td mat-cell *matCellDef="let element">

                    {{element.assignedQuantity}}

                </td>

            </ng-container>

            <!-- ACTION -->

            <ng-container matColumnDef="action">

                <th mat-header-cell *matHeaderCellDef>

                    Action

                </th>
                <td mat-cell *matCellDef="let element">

                    <button mat-icon-button class="view-btn" (click)="viewProduct(element)">

                        <i class="fa fa-eye"></i>

                    </button>

                </td>

                <td mat-cell *matCellDef="let element">

                    <button mat-raised-button color="warn" (click)="returnProduct(element)">

                        Return

                    </button>

                </td>

            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns">

            </tr>

            <tr mat-row *matRowDef="let row; columns: displayedColumns">

            </tr>

        </table>

        <mat-paginator [pageSizeOptions]="[5,10,20]" showFirstLastButtons>

        </mat-paginator>

    </div>

</div>
