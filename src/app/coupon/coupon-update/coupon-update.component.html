<div class="container">

    <div class="row">

        <div class="col-md-12">

            <div class="title-section">
                <h2>
                    Update Coupon
                </h2>
            </div>

        </div>

        <div class="category-card">

            <form [formGroup]="couponForm" (ngSubmit)="onSubmit()">

                <div class="form-layout">

                    <!-- Row 1 -->

                    <div class="form-group">

                        <label>
                            Coupon Code
                        </label>

                        <input type="text" formControlName="code" placeholder="Enter Coupon Code">

                    </div>

                    <div class="form-group">

                        <label>
                            Discount Type
                        </label>

                        <select formControlName="discountType">

                            <option value="">
                                Select Discount Type
                            </option>

                            <option value="PERCENTAGE">
                                Percentage
                            </option>

                            <option value="FLAT">
                                Flat
                            </option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label>
                            Discount Value
                        </label>

                        <input type="number" formControlName="value" placeholder="Enter Discount Value">

                    </div>

                    <!-- Row 2 -->

                    <div class="form-group">

                        <label>
                            Minimum Order Amount
                        </label>

                        <input type="number" formControlName="minOrderAmount" placeholder="Enter Minimum Order Amount">

                    </div>

                    <div class="form-group">

                        <label>
                            Expiry Date
                        </label>

                        <input type="date" formControlName="expiryDate">

                    </div>

                    <div class="form-group">

                        <label>
                            Status
                        </label>

                        <select formControlName="isActive">

                            <option [ngValue]="true">
                                Active
                            </option>

                            <option [ngValue]="false">
                                Inactive
                            </option>

                        </select>

                    </div>

                </div>

                <div class="button-group">

                    <button type="submit" class="btn-create">

                        Update

                    </button>

                    <button type="button" class="btn-back" (click)="goBack()">

                        Back

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
