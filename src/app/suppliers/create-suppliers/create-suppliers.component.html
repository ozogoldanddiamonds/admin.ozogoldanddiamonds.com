<div class="container">

    <div class="row">

        <div class="col-md-12">

            <div class="title-section">

                <h2>
                    Create Supplier  
                </h2>

            </div>

        </div>


        <div class="category-card">

            <form
                [formGroup]="supplierForm"
                (ngSubmit)="onSubmit()"
            >

                <div class="form-layout">

                    <div class="left-section">

                        <div class="row">


                            <!-- ========================= -->
                            <!-- SUPPLIER NAME -->
                            <!-- ========================= -->

                            <div class="col-4">

                                <div class="form-group">

                                    <label>
                                        Supplier Name
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        formControlName="name"
                                        placeholder="Enter Supplier Name"
                                        [class.is-invalid]="
                                            supplierForm.get('name')?.touched &&
                                            supplierForm.get('name')?.invalid
                                        "
                                    >

                                    <!-- Required -->
                                    <div
                                        class="validation-message"
                                        *ngIf="
                                            supplierForm.get('name')?.touched &&
                                            supplierForm.get('name')?.hasError('required')
                                        "
                                    >
                                        Supplier name is required.
                                    </div>

                                    <!-- Empty spaces -->
                                    <div
                                        class="validation-message"
                                        *ngIf="
                                            supplierForm.get('name')?.touched &&
                                            supplierForm.get('name')?.hasError('pattern')
                                        "
                                    >
                                        Supplier name cannot be empty.
                                    </div>

                                </div>

                            </div>


                            <!-- ========================= -->
                            <!-- COMPANY NAME -->
                            <!-- ========================= -->

                            <div class="col-4">

                                <div class="form-group">

                                    <label>
                                        Company Name
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        formControlName="companyName"
                                        placeholder="Enter Company Name"
                                    >

                                </div>

                            </div>


                            <!-- ========================= -->
                            <!-- PHONE -->
                            <!-- ========================= -->

                            <div class="col-4">

                                <div class="form-group">

                                    <label>
                                        Phone
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        formControlName="phone"
                                        placeholder="Enter Phone Number"
                                        maxlength="10"
                                        inputmode="numeric"
                                        (input)="onPhoneInput($event)"
                                        [class.is-invalid]="
                                            supplierForm.get('phone')?.touched &&
                                            supplierForm.get('phone')?.invalid
                                        "
                                    >

                                    <!-- Required -->
                                    <div
                                        class="validation-message"
                                        *ngIf="
                                            supplierForm.get('phone')?.touched &&
                                            supplierForm.get('phone')?.hasError('required')
                                        "
                                    >
                                        Phone number is required.
                                    </div>

                                    <!-- Invalid phone -->
                                    <div
                                        class="validation-message"
                                        *ngIf="
                                            supplierForm.get('phone')?.touched &&
                                            supplierForm.get('phone')?.hasError('pattern')
                                        "
                                    >
                                        Phone number must contain exactly 10 digits.
                                    </div>

                                </div>

                            </div>


                            <!-- ========================= -->
                            <!-- EMAIL -->
                            <!-- ========================= -->

                            <div class="col-4">

                                <div class="form-group">

                                    <label>
                                        Email
                                    </label>

                                    <input
                                        type="email"
                                        class="form-control"
                                        formControlName="email"
                                        placeholder="Enter Email"
                                    >

                                </div>

                            </div>


                            <!-- ========================= -->
                            <!-- GST NUMBER -->
                            <!-- ========================= -->

                            <div class="col-4">

    <div class="form-group">

        <label>
            GST Number
        </label>

        <input
            type="text"
            class="form-control"
            formControlName="gstNumber"
            placeholder="Enter GST Number"
            maxlength="15"
            style="text-transform: uppercase;"
        >

        <div
            class="text-danger"
            *ngIf="
                supplierForm.get('gstNumber')?.touched &&
                supplierForm.get('gstNumber')?.invalid
            "
        >
            <small
                *ngIf="supplierForm.get('gstNumber')?.errors?.['pattern']"
            >
                Enter a valid GST Number
            </small>
        </div>

    </div>

</div>


                            <!-- ========================= -->
                            <!-- STATUS -->
                            <!-- ========================= -->

                            <div class="col-4">

                                <div class="form-group">

                                    <label>
                                        Status
                                    </label>

                                    <select
                                        class="form-control"
                                        formControlName="isActive"
                                    >

                                        <option [ngValue]="true">
                                            Active
                                        </option>

                                        <option [ngValue]="false">
                                            Inactive
                                        </option>

                                    </select>

                                </div>

                            </div>


                            <!-- ========================= -->
                            <!-- ADDRESS TITLE -->
                            <!-- ========================= -->

                            <div class="col-12">

                                <div class="form-group">

                                    <label>
                                        Address
                                    </label>

                                </div>

                            </div>


                            <!-- ========================= -->
                            <!-- ADDRESS LINE 1 -->
                            <!-- ========================= -->

                            <div class="col-4">

                                <div class="form-group">

                                    <label>
                                        Address Line 1
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        formControlName="addressLine1"
                                        placeholder="Enter Address Line 1"
                                    >

                                </div>

                            </div>


                            <!-- ========================= -->
                            <!-- ADDRESS LINE 2 -->
                            <!-- ========================= -->

                            <div class="col-4">

                                <div class="form-group">

                                    <label>
                                        Address Line 2
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        formControlName="addressLine2"
                                        placeholder="Enter Address Line 2"
                                    >

                                </div>

                            </div>


                            <!-- ========================= -->
                            <!-- CITY -->
                            <!-- ========================= -->

                            <div class="col-4">

                                <div class="form-group">

                                    <label>
                                        City
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        formControlName="city"
                                        placeholder="Enter City"
                                    >

                                </div>

                            </div>


                            <!-- ========================= -->
                            <!-- STATE -->
                            <!-- ========================= -->

                            <div class="col-4">

                                <div class="form-group">

                                    <label>
                                        State
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        formControlName="state"
                                        placeholder="Enter State"
                                    >

                                </div>

                            </div>


                            <!-- ========================= -->
                            <!-- PINCODE -->
                            <!-- ========================= -->

                            <div class="col-4">

                                <div class="form-group">

                                    <label>
                                        Pincode
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        formControlName="pincode"
                                        placeholder="Enter Pincode"
                                        maxlength="6"
                                    >

                                </div>

                            </div>


                            <!-- ========================= -->
                            <!-- COUNTRY -->
                            <!-- ========================= -->

                            <div class="col-4">

                                <div class="form-group">

                                    <label>
                                        Country
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        formControlName="country"
                                        placeholder="Enter Country"
                                    >

                                </div>

                            </div>


                            <!-- ========================= -->
                            <!-- NOTES -->
                            <!-- ========================= -->

                            <div class="col-12">

                                <div class="form-group">

                                    <label>
                                        Notes
                                    </label>

                                    <textarea
                                        class="form-control"
                                        formControlName="notes"
                                        rows="3"
                                        placeholder="Enter Notes"
                                    ></textarea>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- ========================= -->
                <!-- BUTTONS -->
                <!-- ========================= -->

                <div class="button-group">


                    <!-- SAVE -->
                    <button
                        type="submit"
                        class="btn-create"
                        [disabled]="isSaving"
                    >

                        <span
                            *ngIf="isSaving"
                            class="spinner-border spinner-border-sm me-2"
                            role="status"
                            aria-hidden="true"
                        ></span>

                        {{ isSaving ? 'Saving...' : 'Save' }}

                    </button>


                    <!-- BACK -->
                    <button
                        type="button"
                        class="btn-back"
                        (click)="goBack()"
                        [disabled]="isSaving"
                    >

                        Back

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
