<div class="size-chart-dialog">

  <div class="dialog-header">
    <div>
      <span class="dialog-badge">SIZE CHART</span>
      <h2>{{ data?.title || 'Size Chart Details' }}</h2>
    </div>

    <button
      type="button"
      class="close-btn"
      (click)="close()">
      <i class="fa fa-times"></i>
    </button>
  </div>

  <div class="dialog-body">

    <!-- Image -->
    <div
      class="size-chart-image"
      *ngIf="data?.image">

      <img
        [src]="data.image"
        [alt]="data?.title || 'Size Chart'">
    </div>

    <!-- Details -->
    <div class="details-section">

      <div class="detail-item">
        <label>Title</label>
        <p>{{ data?.title || '-' }}</p>
      </div>

      <div class="detail-item">
        <label>Sub Category</label>
<p>{{ getSubCategoryName() }}</p>      </div>

      <div class="detail-item">
        <label>Status</label>

        <span
          class="status"
          [class.active]="data?.isActive"
          [class.inactive]="!data?.isActive">

          {{ data?.isActive ? 'Active' : 'Inactive' }}

        </span>
      </div>

    </div>

  </div>

  <div class="dialog-footer">

    <button
      type="button"
      class="close-button"
      (click)="close()">
      Close
    </button>

  </div>

</div>
