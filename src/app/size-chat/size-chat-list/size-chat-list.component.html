<div class="category-container">

  <!-- Top Row -->
  <div class="top-row">

    <div class="title-section">
      <h2>Size Chart Management</h2>
      <p>Manage all Size Charts here</p>
    </div>

    <div class="button-section">
      <button routerLink="/admin/create-sizechat">
        Add Size Chart
      </button>
    </div>

  </div>

  <!-- Search -->

  <div class="search-row">

    <mat-form-field appearance="outline" class="w-100">

      <mat-label>Search Size Chart</mat-label>

      <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="Enter title">

    </mat-form-field>

  </div>

  <!-- Table -->

  <div class="table-row">

    <table
      mat-table
      [dataSource]="dataSource"
      matSort>

      <!-- S.No -->

      <ng-container matColumnDef="sno">

        <th mat-header-cell *matHeaderCellDef>
          S.No
        </th>

        <td mat-cell *matCellDef="let element; let i=index">
          {{i+1}}
        </td>

      </ng-container>

      <!-- Title -->

      <ng-container matColumnDef="title">

        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header>

          Title

        </th>

        <td mat-cell *matCellDef="let element">

          {{element.title}}

        </td>

      </ng-container>

      <!-- Sub Category -->

      <ng-container matColumnDef="subCategory">

        <th mat-header-cell *matHeaderCellDef>

          Sub Category

        </th>

        <td mat-cell *matCellDef="let element">

          {{element.subCategory?.name}}

        </td>

      </ng-container>

      <!-- Image -->

      <ng-container matColumnDef="image">

        <th mat-header-cell *matHeaderCellDef>

          Image

        </th>

        <td mat-cell *matCellDef="let element">

          <img
            [src]="element.image"
            width="60"
            height="60">

        </td>

      </ng-container>

      <!-- Status -->

      <ng-container matColumnDef="isActive">

        <th mat-header-cell *matHeaderCellDef>

          Status

        </th>

        <td mat-cell *matCellDef="let element">

          {{element.isActive ? 'Active' : 'Inactive'}}

        </td>

      </ng-container>

      <!-- Actions -->

      <ng-container matColumnDef="actions">

        <th mat-header-cell *matHeaderCellDef>

          Actions

        </th>

        <td mat-cell *matCellDef="let element">

          <div class="action-buttons">

            <button
              mat-icon-button
              class="view-btn"
              (click)="viewSizeChart(element)">

              <i class="fa fa-eye"></i>

            </button>

            <button
              mat-icon-button
              class="edit-btn"
              (click)="editSizeChart(element)">

              <i class="fa fa-pencil"></i>

            </button>

            <button
              mat-icon-button
              class="delete-btn"
              (click)="deleteSizeChart(element)">

              <i class="fa fa-trash"></i>

            </button>

          </div>

        </td>

      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

    <mat-paginator
      [pageSizeOptions]="[5,10,20,50]"
      showFirstLastButtons>

    </mat-paginator>

  </div>

</div>
