<div class="container-fluid">

    <div class="row">

        <!-- ========================================== -->
        <!-- TITLE -->
        <!-- ========================================== -->

        <div class="col-md-12">

            <div class="title-section">

                <h2>
                    Create Gold Smith
                </h2>

                <p>
                    Add a new Gold Smith and maintain contact details
                </p>

            </div>

        </div>


        <!-- ========================================== -->
        <!-- FORM CARD -->
        <!-- ========================================== -->

        <div class="col-md-12">

            <div class="category-card">

                <form [formGroup]="makerForm" (ngSubmit)="onSubmit()">


                    <div class="form-layout">

                        <div class="left-section">

                            <div class="row">


                                <!-- ================================= -->
                                <!-- BASIC INFORMATION -->
                                <!-- ================================= -->

                                <div class="col-12">

                                    <div class="section-title">

                                        <h4>
                                            Gold Smith Information
                                        </h4>

                                    </div>

                                </div>


                                <!-- Maker Name -->

                                <div class="col-4">

                                    <div class="form-group">

                                        <label>

                                            Gold Smith Name

                                            <span class="required">
                                                *
                                            </span>

                                        </label>


                                        <input type="text" class="form-control" formControlName="name"
                                            placeholder="Enter Gold Smith Name">

                                    </div>

                                </div>


                                <!-- Phone -->

                                <div class="col-4">

                                    <div class="form-group">

                                        <label>

                                            Phone

                                            <span class="required">
                                                *
                                            </span>

                                        </label>


                                        <input type="text" class="form-control" formControlName="phone" maxlength="10"
                                            placeholder="Enter Phone Number">

                                    </div>

                                </div>


                                <!-- Email -->

                                <div class="col-4">

                                    <div class="form-group">

                                        <label>
                                            Email
                                        </label>


                                        <input type="email" class="form-control" formControlName="email"
                                            placeholder="Enter Email">

                                    </div>

                                </div>


                                <!-- Specialization -->

                                <div class="col-8">

                                    <div class="form-group">

                                        <label>
                                            Specialization
                                        </label>


                                        <input type="text" class="form-control" formControlName="specialization"
                                            placeholder="Enter Maker Specialization">

                                    </div>

                                </div>


                                <!-- Status -->

                                <div class="col-4">

                                    <div class="form-group">

                                        <label>
                                            Status
                                        </label>


                                        <select class="form-control" formControlName="isActive">

                                            <option [ngValue]="true">
                                                Active
                                            </option>

                                            <option [ngValue]="false">
                                                Inactive
                                            </option>

                                        </select>

                                    </div>

                                </div>


                                <!-- ================================= -->
                                <!-- ADDRESS -->
                                <!-- ================================= -->

                                <div class="col-12">

                                    <div class="section-title">

                                        <h4>
                                            Address Information
                                        </h4>

                                    </div>

                                </div>


                                <!-- Address Line 1 -->

                                <div class="col-4">

                                    <div class="form-group">

                                        <label>
                                            Address Line 1
                                        </label>


                                        <input type="text" class="form-control" formControlName="addressLine1"
                                            placeholder="Enter Address Line 1">

                                    </div>

                                </div>


                                <!-- Address Line 2 -->

                                <div class="col-4">

                                    <div class="form-group">

                                        <label>
                                            Address Line 2
                                        </label>


                                        <input type="text" class="form-control" formControlName="addressLine2"
                                            placeholder="Enter Address Line 2">

                                    </div>

                                </div>


                                <!-- City -->

                                <div class="col-4">

                                    <div class="form-group">

                                        <label>
                                            City
                                        </label>


                                        <input type="text" class="form-control" formControlName="city"
                                            placeholder="Enter City">

                                    </div>

                                </div>


                                <!-- State -->

                                <div class="col-4">

                                    <div class="form-group">

                                        <label>
                                            State
                                        </label>


                                        <input type="text" class="form-control" formControlName="state"
                                            placeholder="Enter State">

                                    </div>

                                </div>


                                <!-- Pincode -->

                                <div class="col-4">

                                    <div class="form-group">

                                        <label>
                                            Pincode
                                        </label>


                                        <input type="text" class="form-control" formControlName="pincode" maxlength="6"
                                            placeholder="Enter Pincode">

                                    </div>

                                </div>


                                <!-- Country -->

                                <div class="col-4">

                                    <div class="form-group">

                                        <label>
                                            Country
                                        </label>


                                        <input type="text" class="form-control" formControlName="country"
                                            placeholder="Enter Country">

                                    </div>

                                </div>


                                <!-- ================================= -->
                                <!-- NOTES -->
                                <!-- ================================= -->

                                <div class="col-12">

                                    <div class="section-title">

                                        <h4>
                                            Additional Information
                                        </h4>

                                    </div>

                                </div>


                                <!-- Notes -->

                                <div class="col-12">

                                    <div class="form-group">

                                        <label>
                                            Notes
                                        </label>


                                        <textarea class="form-control" formControlName="notes" rows="4"
                                            placeholder="Enter Notes">
                                        </textarea>

                                    </div>

                                </div>


                            </div>

                        </div>

                    </div>


                    <!-- ====================================== -->
                    <!-- BUTTONS -->
                    <!-- ====================================== -->

                    <div class="button-group">


                        <button type="submit" class="btn-create" [disabled]="isLoading">

                            <span *ngIf="!isLoading">

                                <i class="fa fa-save me-2"></i>

                                Save Gold Smith

                            </span>


                            <span *ngIf="isLoading">

                                <i class="fa fa-spinner fa-spin me-2">
                                </i>

                                Creating...

                            </span>

                        </button>


                        <button type="button" class="btn-back" (click)="goBack()">

                            <i class="fa fa-arrow-left me-2"></i>

                            Back

                        </button>

                    </div>


                </form>

            </div>

        </div>

    </div>

</div>
