<div class="category-container">

    <div class="container-fluid">

        <div class="row">

            <!-- ========================================== -->
            <!-- TITLE -->
            <!-- ========================================== -->

            <div class="col-md-12">

                <div class="title-section">

                    <h2>
                        Create Gold Smith Production
                    </h2>

                    <p>
                        Create and assign a production to a gold smith
                    </p>

                </div>

            </div>


            <!-- ========================================== -->
            <!-- FORM CARD -->
            <!-- ========================================== -->

            <div class="col-md-12">

                <div class="category-card">

                    <form
                        [formGroup]="makerProductionForm"
                        (ngSubmit)="onSubmit()"
                        novalidate>

                        <div class="form-layout">

                            <div class="left-section">

                                <div class="row">


                                    <!-- ================================= -->
                                    <!-- PRODUCTION INFORMATION -->
                                    <!-- ================================= -->

                                    <div class="col-12">

                                        <div class="section-title">

                                            <h4>
                                                Production Information
                                            </h4>

                                        </div>

                                    </div>


                                    <!-- ================================= -->
                                    <!-- Maker -->
                                    <!-- ================================= -->

                                    <div class="col-4">

                                        <div class="form-group">

                                            <label>
                                                Gold Smith
                                                <span class="required">*</span>
                                            </label>

                                            <select
                                                class="form-control"
                                                formControlName="maker"
                                                [class.is-invalid]="
                                                    makerProductionForm.get('maker')?.invalid &&
                                                    makerProductionForm.get('maker')?.touched
                                                ">

                                                <option value="">
                                                    Select Gold Smith
                                                </option>

                                                <option
                                                    *ngFor="let maker of makerList"
                                                    [value]="maker._id">

                                                    {{ maker.name }} - {{ maker.phone }}

                                                </option>

                                            </select>

                                            <!-- Validation -->

                                            <div
                                                class="text-danger mt-1"
                                                *ngIf="
                                                    makerProductionForm.get('maker')?.invalid &&
                                                    makerProductionForm.get('maker')?.touched
                                                ">

                                                Gold Smith is required.

                                            </div>

                                        </div>

                                    </div>


                                    <!-- ================================= -->
                                    <!-- Production Number -->
                                    <!-- ================================= -->

                                    <div class="col-4">

                                        <div class="form-group">

                                            <label>

                                                Production Number

                                                <span class="required">
                                                    *
                                                </span>

                                            </label>

                                            <input
                                                type="text"
                                                class="form-control"
                                                formControlName="productionNumber"
                                                placeholder="Enter Production Number"
                                                maxlength="50"
                                                [class.is-invalid]="
                                                    makerProductionForm.get('productionNumber')?.invalid &&
                                                    makerProductionForm.get('productionNumber')?.touched
                                                ">

                                            <!-- Required Validation -->

                                            <div
                                                class="text-danger mt-1"
                                                *ngIf="
                                                    makerProductionForm.get('productionNumber')?.hasError('required') &&
                                                    makerProductionForm.get('productionNumber')?.touched
                                                ">

                                                Production Number is required.

                                            </div>

                                            <!-- Maximum Length Validation -->

                                            <div
                                                class="text-danger mt-1"
                                                *ngIf="
                                                    makerProductionForm.get('productionNumber')?.hasError('maxlength') &&
                                                    makerProductionForm.get('productionNumber')?.touched
                                                ">

                                                Production Number cannot exceed 50 characters.

                                            </div>

                                        </div>

                                    </div>


                                    <!-- ================================= -->
                                    <!-- Status -->
                                    <!-- ================================= -->

                                    <div class="col-4">

                                        <div class="form-group">

                                            <label>
                                                Status
                                            </label>

                                            <select
                                                class="form-control"
                                                formControlName="status">

                                                <option value="DRAFT">
                                                    Draft
                                                </option>

                                                <option value="ISSUED">
                                                    Issued
                                                </option>

                                                <option value="IN_PROGRESS">
                                                    In Progress
                                                </option>

                                                <option value="COMPLETED">
                                                    Completed
                                                </option>

                                                <option value="CANCELLED">
                                                    Cancelled
                                                </option>

                                            </select>

                                        </div>

                                    </div>


                                    <!-- ================================= -->
                                    <!-- DATES -->
                                    <!-- ================================= -->

                                    <div class="col-12">

                                        <div class="section-title">

                                            <h4>
                                                Production Dates
                                            </h4>

                                        </div>

                                    </div>


                                    <!-- ================================= -->
                                    <!-- Issue Date -->
                                    <!-- ================================= -->

                                    <div class="col-4">

                                        <div class="form-group">

                                            <label>
                                                Issue Date
                                            </label>

                                            <input
                                                type="date"
                                                class="form-control"
                                                formControlName="issueDate">

                                        </div>

                                    </div>


                                    <!-- ================================= -->
                                    <!-- Expected Date -->
                                    <!-- ================================= -->

                                    <div class="col-4">

                                        <div class="form-group">

                                            <label>
                                                Expected Date
                                            </label>

                                            <input
                                                type="date"
                                                class="form-control"
                                                formControlName="expectedDate">

                                        </div>

                                    </div>


                                    <!-- ================================= -->
                                    <!-- Received Date -->
                                    <!-- ================================= -->

                                    <div class="col-4">

                                        <div class="form-group">

                                            <label>
                                                Received Date
                                            </label>

                                            <input
                                                type="date"
                                                class="form-control"
                                                formControlName="receivedDate">

                                        </div>

                                    </div>


                                    <!-- ================================= -->
                                    <!-- NOTES -->
                                    <!-- ================================= -->

                                    <div class="col-12">

                                        <div class="section-title">

                                            <h4>
                                                Additional Information
                                            </h4>

                                        </div>

                                    </div>


                                    <!-- ================================= -->
                                    <!-- Notes -->
                                    <!-- ================================= -->

                                    <div class="col-12">

                                        <div class="form-group">

                                            <label>
                                                Notes
                                            </label>

                                            <textarea
                                                class="form-control"
                                                formControlName="notes"
                                                rows="5"
                                                maxlength="1000"
                                                placeholder="Enter production notes">
                                            </textarea>

                                            <!-- Character Limit -->

                                            <div
                                                class="text-danger mt-1"
                                                *ngIf="
                                                    makerProductionForm.get('notes')?.hasError('maxlength') &&
                                                    makerProductionForm.get('notes')?.touched
                                                ">

                                                Notes cannot exceed 1000 characters.

                                            </div>

                                        </div>

                                    </div>


                                </div>

                            </div>

                        </div>


                        <!-- ====================================== -->
                        <!-- BUTTONS -->
                        <!-- ====================================== -->

                        <div class="button-group">

                            <button
                                type="submit"
                                class="btn-create"
                                [disabled]="isLoading">

                                <span *ngIf="!isLoading">

                                    <i class="fa fa-save me-2"></i>

                                    Save Production

                                </span>

                                <span *ngIf="isLoading">

                                    <i class="fa fa-spinner fa-spin me-2"></i>

                                    Creating...

                                </span>

                            </button>


                            <button
                                type="button"
                                class="btn-back"
                                (click)="goBack()">

                                <i class="fa fa-arrow-left me-2"></i>

                                Back

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
