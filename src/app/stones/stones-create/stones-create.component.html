<div class="container">

    <div class="row">

        <div class="col-md-12">

            <div class="title-section">

                <h2>
                    Create Stone Rate
                </h2>

            </div>

        </div>

        <div class="category-card">

            <form
                [formGroup]="stoneRateForm"
                (ngSubmit)="onSubmit()"
            >

                <div class="form-layout">

                    <div class="left-section">

                        <div class="row">


                            <!-- ========================= -->
                            <!-- STONE TYPE -->
                            <!-- ========================= -->

                            <div class="col-4">

                                <div class="form-group">

                                    <label>
                                        Stone Type
                                        <span class="required">*</span>
                                    </label>

                                    <select
                                        class="form-control"
                                        formControlName="stoneType"
                                    >

                                        <option value="">
                                            Select Stone Type
                                        </option>

                                        <option value="diamond">
                                            Diamond
                                        </option>

                                        <option value="ruby">
                                            Ruby
                                        </option>

                                        <option value="emerald">
                                            Emerald
                                        </option>

                                        <option value="sapphire">
                                            Sapphire
                                        </option>

                                        <option value="pearl">
                                            Pearl
                                        </option>

                                        <option value="opal">
                                            Opal
                                        </option>

                                        <option value="topaz">
                                            Topaz
                                        </option>

                                        <option value="coral">
                                            Coral
                                        </option>

                                        <option value="other">
                                            Other
                                        </option>

                                    </select>


                                    <!-- Validation -->

                                    <div
                                        class="validation-message"
                                        *ngIf="
                                            stoneRateForm.get('stoneType')?.touched &&
                                            stoneRateForm.get('stoneType')?.hasError('required')
                                        "
                                    >
                                        Stone type is required.
                                    </div>

                                </div>

                            </div>



                            <!-- ========================= -->
                            <!-- STONE CATEGORY -->
                            <!-- ========================= -->

                            <div class="col-4">

                                <div class="form-group">

                                    <label>
                                        Stone Category
                                        <span class="required">*</span>
                                    </label>

                                    <select
                                        class="form-control"
                                        formControlName="stoneCategory"
                                    >

                                        <option value="">
                                            Select Category
                                        </option>

                                        <option value="natural">
                                            Natural
                                        </option>

                                        <option value="lab-grown">
                                            Lab Grown
                                        </option>

                                        <option value="premium">
                                            Premium
                                        </option>

                                        <option value="standard">
                                            Standard
                                        </option>

                                    </select>


                                    <!-- Validation -->

                                    <div
                                        class="validation-message"
                                        *ngIf="
                                            stoneRateForm.get('stoneCategory')?.touched &&
                                            stoneRateForm.get('stoneCategory')?.hasError('required')
                                        "
                                    >
                                        Stone category is required.
                                    </div>

                                </div>

                            </div>



                            <!-- ========================= -->
                            <!-- QUALITY -->
                            <!-- ========================= -->

                            <div class="col-4">

                                <div class="form-group">

                                    <label>
                                        Quality
                                        <span class="required">*</span>
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        formControlName="quality"
                                        placeholder="VVS1 / VS1 / AAA"
                                    >


                                    <!-- Validation -->

                                    <div
                                        class="validation-message"
                                        *ngIf="
                                            stoneRateForm.get('quality')?.touched &&
                                            stoneRateForm.get('quality')?.hasError('required')
                                        "
                                    >
                                        Quality is required.
                                    </div>

                                </div>

                            </div>



                            <!-- ========================= -->
                            <!-- UNIT -->
                            <!-- ========================= -->

                            <div class="col-4">

                                <div class="form-group">

                                    <label>
                                        Unit
                                        <span class="required">*</span>
                                    </label>

                                    <select
                                        class="form-control"
                                        formControlName="unit"
                                    >

                                        <option value="">
                                            Select Unit
                                        </option>

                                        <option value="carat">
                                            Carat
                                        </option>

                                        <option value="piece">
                                            Piece
                                        </option>

                                    </select>


                                    <!-- Validation -->

                                    <div
                                        class="validation-message"
                                        *ngIf="
                                            stoneRateForm.get('unit')?.touched &&
                                            stoneRateForm.get('unit')?.hasError('required')
                                        "
                                    >
                                        Unit is required.
                                    </div>

                                </div>

                            </div>



                            <!-- ========================= -->
                            <!-- RATE PER UNIT -->
                            <!-- ========================= -->

                            <div class="col-4">

                                <div class="form-group">

                                    <label>
                                        Rate Per Unit
                                        <span class="required">*</span>
                                    </label>

                                    <input
                                        type="number"
                                        class="form-control"
                                        formControlName="ratePerUnit"
                                        placeholder="Enter Rate Per Unit"
                                    >


                                    <!-- Required Validation -->

                                    <div
                                        class="validation-message"
                                        *ngIf="
                                            stoneRateForm.get('ratePerUnit')?.touched &&
                                            stoneRateForm.get('ratePerUnit')?.hasError('required')
                                        "
                                    >
                                        Rate per unit is required.
                                    </div>


                                    <!-- Minimum Validation -->

                                    <div
                                        class="validation-message"
                                        *ngIf="
                                            stoneRateForm.get('ratePerUnit')?.touched &&
                                            stoneRateForm.get('ratePerUnit')?.hasError('min')
                                        "
                                    >
                                        Rate per unit must be greater than 0.
                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>



                <!-- ========================= -->
                <!-- BUTTONS -->
                <!-- ========================= -->

                <div class="button-group">

                    <button
                        type="submit"
                        class="btn-create"
                        [disabled]="isSaving"
                    >

                        <span
                            *ngIf="isSaving"
                            class="spinner-border spinner-border-sm me-2"
                        >
                        </span>

                        {{ isSaving ? 'Saving...' : 'Save' }}

                    </button>


                    <button
                        type="button"
                        class="btn-back"
                        (click)="goBack()"
                    >
                        Back
                    </button>

                </div>


            </form>

        </div>

    </div>

</div>
