<div class="category-container">

  <div class="top-row">

    <div class="title-section">

      <h2>
        Review Management
      </h2>

      <p>
        Manage all reviews here
      </p>

    </div>

  </div>

  <!-- Search -->

  <div class="search-row">

    <mat-form-field
      appearance="outline"
      class="w-100">

      <mat-label>
        Search Review
      </mat-label>

      <input
        matInput
        (keyup)="applyFilter($event)">

    </mat-form-field>

  </div>

  <!-- Table -->

  <div class="table-row">

    <table
      mat-table
      [dataSource]="dataSource"
      matSort>

      <!-- SNO -->

      <ng-container
        matColumnDef="sno">

        <th
          mat-header-cell
          *matHeaderCellDef>

          S.No

        </th>

        <td
          mat-cell
          *matCellDef="
          let element;
          let i=index">

          {{i+1}}

        </td>

      </ng-container>

      <!-- Product -->

      <ng-container
        matColumnDef="product">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Product

        </th>

        <td
          mat-cell
          *matCellDef="let element">

          {{element.productId?.name}}

        </td>

      </ng-container>

      <!-- User -->

      <ng-container
        matColumnDef="user">

        <th
          mat-header-cell
          *matHeaderCellDef>

          User

        </th>

        <td
          mat-cell
          *matCellDef="let element">

          {{element.userId?.name}}

        </td>

      </ng-container>

      <!-- Rating -->

      <ng-container
        matColumnDef="rating">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Rating

        </th>

        <td
          mat-cell
          *matCellDef="let element">

          ⭐ {{element.rating}}

        </td>

      </ng-container>

      <!-- Title -->

      <ng-container
        matColumnDef="title">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Title

        </th>

        <td
          mat-cell
          *matCellDef="let element">

          {{element.title}}

        </td>

      </ng-container>

      <!-- Image -->

      <ng-container
        matColumnDef="images">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Image

        </th>

        <td
          mat-cell
          *matCellDef="let element">

          <img

            *ngIf="
            element.images?.length"

            [src]="
            element.images[0]"

            width="60"

            height="60">

        </td>

      </ng-container>

      <!-- Created -->

      <ng-container
        matColumnDef="createdAt">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Date

        </th>

        <td
          mat-cell
          *matCellDef="let element">

          {{element.createdAt
          | date:'dd/MM/yyyy'}}

        </td>

      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="
        displayedColumns">
      </tr>

      <tr
        mat-row
        *matRowDef="
        let row;
        columns:
        displayedColumns;">
      </tr>

    </table>

    <mat-paginator
      [pageSizeOptions]="
      [5,10,20,50]">

    </mat-paginator>

  </div>

</div>
