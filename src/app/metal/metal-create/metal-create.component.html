<div class="container">

    <div class="row">

        <div class="col-md-12">

            <div class="title-section">

                <h2>
                    Create Metal Rate
                </h2>

            </div>

        </div>


        <div class="category-card">

            <form
                [formGroup]="metalRateForm"
                (ngSubmit)="onSubmit()">

                <div class="form-layout">

                    <div class="left-section">

                        <div class="row">


                            <!-- ========================= -->
                            <!-- METAL TYPE -->
                            <!-- ========================= -->

                            <div class="col-4">

                                <div class="form-group">

                                    <label for="metalType">
                                        Metal Type
                                    </label>

                                    <select
                                        id="metalType"
                                        class="form-control"
                                        formControlName="metalType"
                                        (change)="onMetalTypeChange()">

                                        <option value="">
                                            Select Metal
                                        </option>

                                        <option value="gold">
                                            Gold
                                        </option>

                                        <option value="silver">
                                            Silver
                                        </option>

                                        <option value="platinum">
                                            Platinum
                                        </option>

                                    </select>


                                    <!-- Validation -->

                                    <div
                                        class="text-danger mt-1"
                                        *ngIf="
                                            metalRateForm.get('metalType')?.touched &&
                                            metalRateForm.get('metalType')?.hasError('required')
                                        ">

                                        Metal type is required.

                                    </div>

                                </div>

                            </div>



                            <!-- ========================= -->
                            <!-- PURITY -->
                            <!-- ========================= -->

                            <div class="col-4">

                                <div class="form-group">

                                    <label for="purity">
                                        Metal Purity
                                    </label>

                                    <select
                                        id="purity"
                                        class="form-control"
                                        formControlName="purity">

                                        <option value="">
                                            Select Purity
                                        </option>

                                        <option
                                            *ngFor="let purity of purityOptions"
                                            [value]="purity">

                                            {{ purity }}

                                        </option>

                                    </select>


                                    <!-- Validation -->

                                    <div
                                        class="text-danger mt-1"
                                        *ngIf="
                                            metalRateForm.get('purity')?.touched &&
                                            metalRateForm.get('purity')?.hasError('required')
                                        ">

                                        Metal purity is required.

                                    </div>

                                </div>

                            </div>



                            <!-- ========================= -->
                            <!-- UNIT -->
                            <!-- ========================= -->

                            <div class="col-4">

                                <div class="form-group">

                                    <label for="unit">
                                        Unit
                                    </label>

                                    <select
                                        id="unit"
                                        class="form-control"
                                        formControlName="unit">

                                        <option value="">
                                            Please Select Unit
                                        </option>

                                        <option value="gram">
                                            Gram
                                        </option>

                                        <option value="gram">
                                            Caret
                                        </option>

                                        <option value="gram">
                                            Bar
                                        </option>

                                    </select>


                                    <!-- Validation -->

                                    <div
                                        class="text-danger mt-1"
                                        *ngIf="
                                            metalRateForm.get('unit')?.touched &&
                                            metalRateForm.get('unit')?.hasError('required')
                                        ">

                                        Unit is required.

                                    </div>

                                </div>

                            </div>



                            <!-- ========================= -->
                            <!-- RATE PER GRAM -->
                            <!-- ========================= -->

                            <div class="col-4">

                                <div class="form-group">

                                    <label for="ratePerGram">
                                        Rate Per Gram
                                    </label>

                                    <input
                                        id="ratePerGram"
                                        type="number"
                                        class="form-control"
                                        formControlName="ratePerGram"
                                        placeholder="Enter Rate Per Gram">


                                    <!-- Required Validation -->

                                    <div
                                        class="text-danger mt-1"
                                        *ngIf="
                                            metalRateForm.get('ratePerGram')?.touched &&
                                            metalRateForm.get('ratePerGram')?.hasError('required')
                                        ">

                                        Rate per gram is required.

                                    </div>


                                    <!-- Minimum Validation -->

                                    <div
                                        class="text-danger mt-1"
                                        *ngIf="
                                            metalRateForm.get('ratePerGram')?.touched &&
                                            metalRateForm.get('ratePerGram')?.hasError('min')
                                        ">

                                        Rate per gram must be greater than 0.

                                    </div>

                                </div>

                            </div>



                            <!-- ========================= -->
                            <!-- EFFECTIVE DATE -->
                            <!-- ========================= -->

                            <div class="col-4">

                                <div class="form-group">

                                    <label for="effectiveDate">
                                        Effective Date
                                    </label>

                                    <input
                                        id="effectiveDate"
                                        type="date"
                                        class="form-control"
                                        formControlName="effectiveDate">

                                </div>

                            </div>


                        </div>

                    </div>

                </div>



                <!-- ========================= -->
                <!-- BUTTONS -->
                <!-- ========================= -->

                <div class="button-group">

                    <button
                        type="submit"
                        class="btn-create"
                        [disabled]="isSaving">

                        <span
                            *ngIf="isSaving"
                            class="spinner-border spinner-border-sm me-2">
                        </span>

                        {{ isSaving ? 'Saving...' : 'Save' }}

                    </button>


                    <button
                        type="button"
                        class="btn-back"
                        (click)="goBack()">

                        Back

                    </button>

                </div>


            </form>

        </div>

    </div>

</div>
