<div class="container">

    <div class="row">

        <div class="col-md-12">

            <!-- TITLE -->
            <div class="title-section">

                <h2>
                    Create Supplier Purchase
                </h2>

                <p>
                    Add new supplier purchase
                </p>

            </div>

        </div>


        <div class="category-card">

            <form
                [formGroup]="supplierPurchaseForm"
                (ngSubmit)="onSubmit()"
            >

                <div class="form-layout">

                    <div class="left-section">

                        <div class="row">


                            <!-- ================================= -->
                            <!-- SUPPLIER -->
                            <!-- ================================= -->

                            <div class="col-md-4">

                                <div class="form-group">

                                    <label>
                                        Supplier
                                    </label>

                                    <select
                                        class="form-control"
                                        formControlName="supplier"
                                        [class.is-invalid]="
                                            supplierPurchaseForm.get('supplier')?.touched &&
                                            supplierPurchaseForm.get('supplier')?.invalid
                                        "
                                    >

                                        <option value="">
                                            Select Supplier
                                        </option>

                                        <option
                                            *ngFor="let supplier of suppliers"
                                            [value]="supplier._id"
                                        >
                                            {{ supplier.name }}
                                        </option>

                                    </select>


                                    <div
                                        class="validation-message"
                                        *ngIf="
                                            supplierPurchaseForm.get('supplier')?.touched &&
                                            supplierPurchaseForm.get('supplier')?.hasError('required')
                                        "
                                    >
                                        Supplier is required.
                                    </div>

                                </div>

                            </div>



                            <!-- ================================= -->
                            <!-- INVOICE NUMBER -->
                            <!-- ================================= -->

                            <div class="col-md-4">

                                <div class="form-group">

                                    <label>
                                        Invoice Number
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        formControlName="invoiceNumber"
                                        placeholder="Enter Invoice Number"
                                        [class.is-invalid]="
                                            supplierPurchaseForm.get('invoiceNumber')?.touched &&
                                            supplierPurchaseForm.get('invoiceNumber')?.invalid
                                        "
                                    >


                                    <div
                                        class="validation-message"
                                        *ngIf="
                                            supplierPurchaseForm.get('invoiceNumber')?.touched &&
                                            supplierPurchaseForm.get('invoiceNumber')?.hasError('required')
                                        "
                                    >
                                        Invoice number is required.
                                    </div>


                                    <div
                                        class="validation-message"
                                        *ngIf="
                                            supplierPurchaseForm.get('invoiceNumber')?.touched &&
                                            supplierPurchaseForm.get('invoiceNumber')?.hasError('pattern')
                                        "
                                    >
                                        Invoice number cannot be empty.
                                    </div>

                                </div>

                            </div>



                            <!-- ================================= -->
                            <!-- INVOICE DATE -->
                            <!-- ================================= -->

                            <div class="col-md-4">

                                <div class="form-group">

                                    <label>
                                        Invoice Date
                                    </label>

                                    <input
                                        type="date"
                                        class="form-control"
                                        formControlName="invoiceDate"
                                        [class.is-invalid]="
                                            supplierPurchaseForm.get('invoiceDate')?.touched &&
                                            supplierPurchaseForm.get('invoiceDate')?.invalid
                                        "
                                    >


                                    <div
                                        class="validation-message"
                                        *ngIf="
                                            supplierPurchaseForm.get('invoiceDate')?.touched &&
                                            supplierPurchaseForm.get('invoiceDate')?.hasError('required')
                                        "
                                    >
                                        Invoice date is required.
                                    </div>

                                </div>

                            </div>



                            <!-- ================================= -->
                            <!-- PURCHASE DATE -->
                            <!-- ================================= -->

                            <div class="col-md-4">

                                <div class="form-group">

                                    <label>
                                        Purchase Date
                                    </label>

                                    <input
                                        type="date"
                                        class="form-control"
                                        formControlName="purchaseDate"
                                    >

                                </div>

                            </div>



                            <!-- ================================= -->
                            <!-- SUBTOTAL -->
                            <!-- ================================= -->

                            <div class="col-md-4">

                                <div class="form-group">

                                    <label>
                                        Subtotal
                                    </label>

                                    <input
                                        type="number"
                                        class="form-control"
                                        formControlName="subtotal"
                                        placeholder="Enter Subtotal"
                                    >

                                </div>

                            </div>



                            <!-- ================================= -->
                            <!-- DISCOUNT -->
                            <!-- ================================= -->

                            <div class="col-md-4">

                                <div class="form-group">

                                    <label>
                                        Discount
                                    </label>

                                    <input
                                        type="number"
                                        class="form-control"
                                        formControlName="discount"
                                        placeholder="Enter Discount"
                                    >

                                </div>

                            </div>



                            <!-- ================================= -->
                            <!-- TAX -->
                            <!-- ================================= -->

                            <div class="col-md-4">

                                <div class="form-group">

                                    <label>
                                        Tax
                                    </label>

                                    <input
                                        type="number"
                                        class="form-control"
                                        formControlName="tax"
                                        placeholder="Enter Tax"
                                    >

                                </div>

                            </div>



                            <!-- ================================= -->
                            <!-- TOTAL AMOUNT -->
                            <!-- ================================= -->

                            <div class="col-md-4">

                                <div class="form-group">

                                    <label>
                                        Total Amount
                                    </label>

                                    <input
                                        type="number"
                                        class="form-control"
                                        formControlName="totalAmount"
                                        placeholder="Enter Total Amount"
                                        [class.is-invalid]="
                                            supplierPurchaseForm.get('totalAmount')?.touched &&
                                            supplierPurchaseForm.get('totalAmount')?.invalid
                                        "
                                    >


                                    <div
                                        class="validation-message"
                                        *ngIf="
                                            supplierPurchaseForm.get('totalAmount')?.touched &&
                                            supplierPurchaseForm.get('totalAmount')?.hasError('required')
                                        "
                                    >
                                        Total amount is required.
                                    </div>

                                </div>

                            </div>



                            <!-- ================================= -->
                            <!-- PAYMENT STATUS -->
                            <!-- ================================= -->

                            <div class="col-md-4">

                                <div class="form-group">

                                    <label>
                                        Payment Status
                                    </label>

                                    <select
                                        class="form-control"
                                        formControlName="paymentStatus"
                                    >

                                        <option value="PENDING">
                                            Pending
                                        </option>

                                        <option value="PARTIAL">
                                            Partial
                                        </option>

                                        <option value="PAID">
                                            Paid
                                        </option>

                                    </select>

                                </div>

                            </div>



                            <!-- ================================= -->
                            <!-- STATUS -->
                            <!-- ================================= -->

                            <div class="col-md-4">

                                <div class="form-group">

                                    <label>
                                        Status
                                    </label>

                                    <select
                                        class="form-control"
                                        formControlName="status"
                                    >

                                        <option value="DRAFT">
                                            Draft
                                        </option>

                                        <option value="RECEIVED">
                                            Received
                                        </option>

                                        <option value="CANCELLED">
                                            Cancelled
                                        </option>

                                    </select>

                                </div>

                            </div>



                            <!-- ================================= -->
                            <!-- NOTES -->
                            <!-- ================================= -->

                            <div class="col-md-12">

                                <div class="form-group">

                                    <label>
                                        Notes
                                    </label>

                                    <textarea
                                        class="form-control"
                                        formControlName="notes"
                                        rows="3"
                                        placeholder="Enter Notes"
                                    ></textarea>

                                </div>

                            </div>



                            <!-- ================================= -->
                            <!-- DOCUMENT UPLOAD -->
                            <!-- ================================= -->

                            <div class="col-md-12">

                                <div class="form-group">

                                    <label>
                                        Upload Documents
                                    </label>

                                    <input
                                        type="file"
                                        class="form-control"
                                        multiple
                                        accept=".jpg,.jpeg,.png,.pdf"
                                        (change)="onDocumentsChange($event)"
                                    >

                                    <small class="text-muted">
                                        You can upload maximum 10 documents
                                    </small>

                                </div>

                            </div>



                            <!-- ================================= -->
                            <!-- DOCUMENT PREVIEW -->
                            <!-- ================================= -->

                            <div
                                class="col-md-12"
                                *ngIf="documentPreviews.length > 0"
                            >

                                <div class="document-section">

                                    <h5>
                                        Selected Documents
                                    </h5>


                                    <div class="document-list">

                                        <div
                                            class="document-card"
                                            *ngFor="
                                                let preview of documentPreviews;
                                                let i = index
                                            "
                                        >


                                            <!-- IMAGE -->

                                            <div
                                                *ngIf="preview.isImage"
                                                class="image-preview"
                                            >

                                                <img
                                                    [src]="preview.url"
                                                    [alt]="preview.name"
                                                >

                                            </div>



                                            <!-- PDF -->

                                            <div
                                                *ngIf="!preview.isImage"
                                                class="pdf-preview"
                                            >

                                                <i class="fa fa-file-pdf-o"></i>

                                            </div>



                                            <!-- FILE INFO -->

                                            <div class="document-info">

                                                <strong>
                                                    {{ preview.name }}
                                                </strong>

                                                <small>
                                                    Selected
                                                </small>

                                            </div>



                                            <!-- VIEW -->

                                            <button
                                                type="button"
                                                class="view-btn"
                                                *ngIf="preview.isImage"
                                                (click)="viewPreview(preview)"
                                            >

                                                <i class="fa fa-eye"></i>

                                            </button>



                                            <!-- REMOVE -->

                                            <button
                                                type="button"
                                                class="delete-btn"
                                                (click)="removeDocument(i)"
                                            >

                                                <i class="fa fa-trash"></i>

                                            </button>

                                        </div>

                                    </div>

                                </div>

                            </div>



                            <!-- ================================= -->
                            <!-- NO DOCUMENT -->
                            <!-- ================================= -->

                            <div
                                class="col-md-12"
                                *ngIf="documentPreviews.length === 0"
                            >

                                <div class="no-document">

                                    No documents selected

                                </div>

                            </div>


                        </div>

                    </div>

                </div>



                <!-- ================================= -->
                <!-- BUTTONS -->
                <!-- ================================= -->

                <div class="button-group">


                    <!-- SAVE -->

                    <button
                        type="submit"
                        class="btn-create"
                        [disabled]="isSaving"
                    >

                        <span
                            *ngIf="isSaving"
                            class="spinner-border spinner-border-sm me-2"
                            role="status"
                            aria-hidden="true"
                        ></span>


                        {{
                            isSaving
                                ? 'Saving...'
                                : 'Save'
                        }}

                    </button>



                    <!-- BACK -->

                    <button
                        type="button"
                        class="btn-back"
                        (click)="goBack()"
                        [disabled]="isSaving"
                    >

                        Back

                    </button>

                </div>


            </form>

        </div>

    </div>

</div>
