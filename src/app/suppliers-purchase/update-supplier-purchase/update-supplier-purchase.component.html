<div class="container">

    <div class="row">

        <div class="col-md-12">

            <!-- TITLE -->

            <div class="title-section">

                <h2>
                    Update Supplier Purchase
                </h2>

                <p>
                    Update supplier purchase details
                </p>

            </div>


            <div class="category-card">

                <form
                    [formGroup]="supplierPurchaseForm"
                    (ngSubmit)="onSubmit()">


                    <div class="form-layout">

                        <div class="left-section">

                            <div class="row">


                                <!-- SUPPLIER -->

                                <div class="col-md-4">

                                    <div class="form-group">

                                        <label>
                                            Supplier
                                        </label>

                                        <select
                                            class="form-control"
                                            formControlName="supplier">

                                            <option value="">
                                                Select Supplier
                                            </option>

                                            <option
                                                *ngFor="let supplier of suppliers"
                                                [value]="supplier._id">

                                                {{ supplier.name }}

                                            </option>

                                        </select>

                                    </div>

                                </div>


                                <!-- INVOICE NUMBER -->

                                <div class="col-md-4">

                                    <div class="form-group">

                                        <label>
                                            Invoice Number
                                        </label>

                                        <input
                                            type="text"
                                            class="form-control"
                                            formControlName="invoiceNumber"
                                            placeholder="Enter Invoice Number">

                                    </div>

                                </div>


                                <!-- INVOICE DATE -->

                                <div class="col-md-4">

                                    <div class="form-group">

                                        <label>
                                            Invoice Date
                                        </label>

                                        <input
                                            type="date"
                                            class="form-control"
                                            formControlName="invoiceDate">

                                    </div>

                                </div>


                                <!-- PURCHASE DATE -->

                                <div class="col-md-4">

                                    <div class="form-group">

                                        <label>
                                            Purchase Date
                                        </label>

                                        <input
                                            type="date"
                                            class="form-control"
                                            formControlName="purchaseDate">

                                    </div>

                                </div>


                                <!-- SUBTOTAL -->

                                <div class="col-md-4">

                                    <div class="form-group">

                                        <label>
                                            Subtotal
                                        </label>

                                        <input
                                            type="number"
                                            class="form-control"
                                            formControlName="subtotal"
                                            placeholder="Enter Subtotal">

                                    </div>

                                </div>


                                <!-- DISCOUNT -->

                                <div class="col-md-4">

                                    <div class="form-group">

                                        <label>
                                            Discount
                                        </label>

                                        <input
                                            type="number"
                                            class="form-control"
                                            formControlName="discount"
                                            placeholder="Enter Discount">

                                    </div>

                                </div>


                                <!-- TAX -->

                                <div class="col-md-4">

                                    <div class="form-group">

                                        <label>
                                            Tax
                                        </label>

                                        <input
                                            type="number"
                                            class="form-control"
                                            formControlName="tax"
                                            placeholder="Enter Tax">

                                    </div>

                                </div>


                                <!-- TOTAL -->

                                <div class="col-md-4">

                                    <div class="form-group">

                                        <label>
                                            Total Amount
                                        </label>

                                        <input
                                            type="number"
                                            class="form-control"
                                            formControlName="totalAmount"
                                            placeholder="Enter Total Amount">

                                    </div>

                                </div>


                                <!-- PAYMENT STATUS -->

                                <div class="col-md-4">

                                    <div class="form-group">

                                        <label>
                                            Payment Status
                                        </label>

                                        <select
                                            class="form-control"
                                            formControlName="paymentStatus">

                                            <option value="PENDING">
                                                Pending
                                            </option>

                                            <option value="PARTIAL">
                                                Partial
                                            </option>

                                            <option value="PAID">
                                                Paid
                                            </option>

                                        </select>

                                    </div>

                                </div>


                                <!-- STATUS -->

                                <div class="col-md-4">

                                    <div class="form-group">

                                        <label>
                                            Status
                                        </label>

                                        <select
                                            class="form-control"
                                            formControlName="status">

                                            <option value="DRAFT">
                                                Draft
                                            </option>

                                            <option value="RECEIVED">
                                                Received
                                            </option>

                                            <option value="CANCELLED">
                                                Cancelled
                                            </option>

                                        </select>

                                    </div>

                                </div>


                                <!-- NOTES -->

                                <div class="col-md-12">

                                    <div class="form-group">

                                        <label>
                                            Notes
                                        </label>

                                        <textarea
                                            class="form-control"
                                            formControlName="notes"
                                            rows="3"
                                            placeholder="Enter Notes">
                                        </textarea>

                                    </div>

                                </div>


                                <!-- ============================= -->
                                <!-- UPLOAD DOCUMENTS -->
                                <!-- ============================= -->

                                <div class="col-md-12">

                                    <div class="form-group">

                                        <label>
                                            Upload Documents
                                        </label>

                                        <input
                                            type="file"
                                            class="form-control"
                                            multiple
                                            accept=".jpg,.jpeg,.png,.pdf"
                                            (change)="onDocumentsChange($event)">

                                        <small class="text-muted">
                                            You can upload maximum 10 documents
                                        </small>

                                    </div>

                                </div>


                                <!-- ============================= -->
                                <!-- EXISTING DOCUMENTS -->
                                <!-- ============================= -->

                             <!-- ============================= -->
<!-- EXISTING DOCUMENTS -->
<!-- ============================= -->

<div
    class="col-md-12"
    *ngIf="existingDocuments.length > 0">

    <div class="document-section">

        <h5>
            Existing Documents
        </h5>

        <div class="document-list">

            <div
                class="document-card"
                *ngFor="
                    let document of existingDocuments;
                    let i = index
                ">

                <!-- IMAGE -->
                <div
                    *ngIf="isImage(document.url)"
                    class="image-preview">

                    <img
                        [src]="document.url"
                        alt="Document">

                </div>


                <!-- PDF -->
                <div
                    *ngIf="isPdf(document)"
                    class="pdf-preview">

                    <i class="fa fa-file-pdf-o"></i>

                </div>


                <!-- FILE NAME -->
                <div class="document-info">

                    <strong>
                        {{
                            document.description ||
                            'Document'
                        }}
                    </strong>

                    <small>
                        {{
                            isPdf(document)
                                ? 'PDF File'
                                : 'Image File'
                        }}
                    </small>

                </div>


                <!-- VIEW -->
                <button
                    type="button"
                    class="view-btn"
                    title="View Document"
                    (click)="viewDocument(document.url)">

                    <i class="fa fa-eye"></i>

                </button>


                <!-- DELETE -->
                <button
                    type="button"
                    class="delete-btn"
                    title="Delete Document"
                    (click)="removeExistingDocument(i)">

                    <i class="fa fa-trash"></i>

                </button>

            </div>

        </div>

    </div>

</div>


                                <!-- ============================= -->
                                <!-- NEW DOCUMENTS -->
                                <!-- ============================= -->

                                <div
                                    class="col-md-12"
                                    *ngIf="documentPreviews.length > 0">

                                    <div class="document-section">

                                        <h5>
                                            New Documents
                                        </h5>


                                        <div class="document-list">

                                            <div
                                                class="document-card"
                                                *ngFor="
                                                    let preview of documentPreviews;
                                                    let i = index
                                                ">


                                                <!-- IMAGE -->

                                                <div
                                                    *ngIf="preview.isImage"
                                                    class="image-preview">

                                                    <img
                                                        [src]="preview.url"
                                                        alt="New Document">

                                                </div>


                                                <!-- PDF -->

                                                <div
                                                    *ngIf="!preview.isImage"
                                                    class="pdf-preview">

                                                    <i class="fa fa-file-pdf-o"></i>

                                                </div>


                                                <div class="document-info">

                                                    <strong>
                                                        {{ preview.name }}
                                                    </strong>

                                                    <small>
                                                        New File
                                                    </small>

                                                </div>


                                                <!-- DELETE -->

                                                <button
                                                    type="button"
                                                    class="delete-btn"
                                                    (click)="removeNewDocument(i)">

                                                    <i class="fa fa-trash"></i>

                                                </button>

                                            </div>

                                        </div>

                                    </div>

                                </div>


                                <!-- NO DOCUMENT -->

                                <div
                                    class="col-md-12"
                                    *ngIf="
                                        existingDocuments.length === 0 &&
                                        documentPreviews.length === 0
                                    ">

                                    <div class="no-document">
                                        No documents available
                                    </div>

                                </div>


                            </div>

                        </div>

                    </div>


                    <!-- ============================= -->
                    <!-- BUTTONS -->
                    <!-- ============================= -->

                    <div class="button-group">

                        <button
                            type="submit"
                            class="btn-create"
                            [disabled]="isSaving">

                            <span
                                *ngIf="isSaving"
                                class="spinner-border spinner-border-sm me-2">
                            </span>

                            {{
                                isSaving
                                    ? 'Updating...'
                                    : 'Update'
                            }}

                        </button>


                        <button
                            type="button"
                            class="btn-back"
                            (click)="goBack()">

                            Back

                        </button>

                    </div>


                </form>

            </div>

        </div>

    </div>

</div>
